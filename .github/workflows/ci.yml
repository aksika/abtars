name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect extended-test changes
    runs-on: ubuntu-latest
    outputs:
      extended: ${{ steps.filter.outputs.extended }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect deployment-sensitive paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            extended:
              - 'src/cli/**'
              - 'src/boot/**'
              - 'src/supervisor/**'
              - 'src/components/commands/**'
              - 'src/components/transport/**'
              - 'src/bridge-app.ts'
              - 'src/main.ts'
              - 'src/paths.ts'
              - 'scripts/**'
              - 'esbuild.config.js'
              - 'package.json'
              - 'package-lock.json'
              - 'install-manifest.json'
              - 'vitest.config.ts'
              - '.github/workflows/**'

  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Check shared utilities
        run: ./scripts/check-shared-utils.sh

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node esbuild.config.js

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: npm test -- --silent

      - name: Smoke test (install + help)
        run: node bundle/abtars-cli.js --help

  extended-tests:
    name: Extended tests
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Explain extended-test decision
        env:
          EXTENDED_PATHS: ${{ needs.changes.outputs.extended }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" || "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" || "$EXTENDED_PATHS" == "true" ]]; then
            echo "run=true" >> "$GITHUB_ENV"
            echo "Extended tests are required."
          else
            echo "run=false" >> "$GITHUB_ENV"
            echo "Extended tests are not applicable for this change."
          fi

      - uses: actions/checkout@v4
        if: env.run == 'true'

      - name: Setup Node.js
        if: env.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        if: env.run == 'true'
        run: npm ci

      - name: Build
        if: env.run == 'true'
        run: node esbuild.config.js

      - name: Typecheck
        if: env.run == 'true'
        run: npm run typecheck

      - name: Extended tests
        if: env.run == 'true'
        run: npm run test:extended
